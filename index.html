<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060d1a" />
  <meta name="description" content="A bilingual geography quiz for countries, capitals and continents." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Geography Hub" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Geography Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Grotesk:wght@400;600;700&display=swap');



:root {
  --bg: #060d1a;
  --panel: rgba(255,255,255,0.055);
  --panel2: rgba(255,255,255,0.08);
  --text: #eaf0ff;
  --muted: rgba(200,215,255,0.65);
  --border: rgba(255,255,255,0.10);
  --blue: #3b6bff;
  --green: #10d97e;
  --red: #ff4f4f;
  --amber: #ffb020;
  --purple: #a855f7;
  --cyan: #06c8e8;
  --shadow: 0 8px 40px rgba(0,0,0,0.5);
  --glow-green: 0 0 24px rgba(16,217,126,0.45);
  --glow-blue: 0 0 24px rgba(59,107,255,0.45);
  --glow-amber: 0 0 20px rgba(255,176,32,0.4);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background:
    radial-gradient(ellipse 900px 600px at 10% 0%, rgba(59,107,255,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 700px 500px at 90% 20%, rgba(168,85,247,0.14) 0%, transparent 60%),
    radial-gradient(ellipse 600px 400px at 50% 100%, rgba(6,200,232,0.10) 0%, transparent 60%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ─── Stars bg ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 65%, rgba(255,255,255,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 75%, rgba(255,255,255,0.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.3) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

.app {
  max-width: 1000px;
  margin: 24px auto;
  padding: 16px;
  position: relative;
  z-index: 1;
}

/* ─── Header ─── */
.header {
  display: flex;
  gap: 16px;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

h1 {
  margin: 0 0 4px;
  font-family: 'Nunito', sans-serif;
  font-size: 32px;
  font-weight: 900;
  background: linear-gradient(135deg, #fff 0%, var(--cyan) 60%, var(--blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

.sub { margin: 0; color: var(--muted); font-size: 14px; }

/* ─── Stats ─── */
.stats { display: flex; gap: 10px; }

.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 10px 16px;
  min-width: 88px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s;
}

.stat::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
  pointer-events: none;
}

.stat.pulse-anim {
  animation: statPulse 0.35s ease-out;
}

@keyframes statPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.12); box-shadow: var(--glow-green); }
  100% { transform: scale(1); }
}

.statLabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.statValue {
  font-family: 'Nunito', sans-serif;
  font-size: 26px;
  font-weight: 900;
  margin-top: 2px;
  transition: color 0.3s;
}

#timeLeft { color: var(--cyan); }
#score { color: var(--green); }
#foundCount { color: var(--purple); }

/* ─── Timer bar ─── */
.timer-bar-wrap {
  margin: 0 0 14px;
  position: relative;
  height: 10px;
  background: rgba(255,255,255,0.07);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.timer-bar-fill {
  height: 100%;
  width: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--blue), var(--cyan), var(--green));
  transform-origin: left center;
  transition: transform 1s linear, background 1s ease;
  position: relative;
}

.timer-bar-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan), 0 0 20px rgba(6,200,232,0.5);
  opacity: 1;
  transition: opacity 0.3s;
}

.timer-bar-fill.warning {
  background: linear-gradient(90deg, var(--amber), var(--red));
  animation: timerPulse 0.6s ease-in-out infinite;
}

.timer-bar-fill.warning::after {
  background: var(--red);
  box-shadow: 0 0 10px var(--red), 0 0 20px rgba(255,79,79,0.5);
}

@keyframes timerPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

/* ─── Panel ─── */
.panel {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 18px;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

/* ─── Tabs ─── */
.tabs {
  display: inline-flex;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 4px;
  gap: 4px;
}

.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 9px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  transition: background 0.2s, color 0.2s;
  font-family: inherit;
}

.tab:hover { color: var(--text); }
.tab.active {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #fff;
  box-shadow: 0 2px 16px rgba(59,107,255,0.35);
}

/* ─── Controls ─── */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toggle { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
.toggle input { transform: translateY(1px); accent-color: var(--green); }

/* ─── Buttons ─── */
.btn {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  font-family: inherit;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
}

.btn:hover { background: rgba(255,255,255,0.10); transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }

.btn.primary {
  background: linear-gradient(135deg, rgba(59,107,255,0.25), rgba(168,85,247,0.20));
  border-color: rgba(59,107,255,0.5);
}
.btn.primary:hover {
  background: linear-gradient(135deg, rgba(59,107,255,0.40), rgba(168,85,247,0.30));
  box-shadow: var(--glow-blue);
}

.btn.accent {
  background: linear-gradient(135deg, rgba(255,176,32,0.22), rgba(255,79,79,0.15));
  border-color: rgba(255,176,32,0.5);
}
.btn.accent:hover {
  background: linear-gradient(135deg, rgba(255,176,32,0.35), rgba(255,79,79,0.25));
  box-shadow: var(--glow-amber);
}

/* ─── Letters ─── */
.letters {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 10px;
  background: rgba(0,0,0,0.22);
  border: 1px solid var(--border);
  border-radius: 18px;
  margin-bottom: 14px;
}

.letter {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: var(--muted);
  cursor: pointer;
  font-weight: 800;
  font-size: 13px;
  transition: background 0.15s, color 0.15s, transform 0.1s, box-shadow 0.15s;
  font-family: 'Nunito', sans-serif;
}

.letter:hover {
  background: rgba(255,255,255,0.10);
  color: var(--text);
  transform: translateY(-2px);
}

.letter.active {
  background: linear-gradient(135deg, rgba(16,217,126,0.28), rgba(6,200,232,0.22));
  border-color: rgba(16,217,126,0.55);
  color: var(--green);
  box-shadow: 0 0 14px rgba(16,217,126,0.3);
}

/* ─── Continent picker ─── */
.continents {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px;
  background: rgba(0,0,0,0.22);
  border: 1px solid var(--border);
  border-radius: 18px;
  margin-bottom: 14px;
}

.continent-btn {
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: var(--muted);
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  transition: background 0.15s, color 0.15s, transform 0.1s, box-shadow 0.15s;
  font-family: 'Nunito', sans-serif;
}

.continent-btn:hover {
  background: rgba(255,255,255,0.10);
  color: var(--text);
  transform: translateY(-2px);
}

.continent-btn.active {
  background: linear-gradient(135deg, rgba(59,107,255,0.30), rgba(168,85,247,0.25));
  border-color: rgba(59,107,255,0.55);
  color: #a5c3ff;
  box-shadow: 0 0 14px rgba(59,107,255,0.25);
}

.list li.filled { color: var(--green); font-weight: 600; }

/* ─── Prompt ─── */
.prompt { margin: 0 0 10px; }
.promptText {
  font-family: 'Nunito', sans-serif;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.3px;
}
.hint { margin-top: 5px; color: var(--muted); font-size: 13px; }

/* ─── Answer row ─── */
.answerRow { display: flex; gap: 10px; align-items: center; }

.answerInput {
  flex: 1;
  padding: 13px 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

.answerInput:focus {
  border-color: rgba(59,107,255,0.6);
  box-shadow: 0 0 0 3px rgba(59,107,255,0.15);
}

.answerInput.shake {
  animation: shake 0.35s ease-out;
  border-color: rgba(255,79,79,0.6) !important;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* ─── Feedback ─── */
.feedback {
  min-height: 28px;
  margin-top: 10px;
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: opacity 0.2s;
}
.feedback.ok { color: var(--green); text-shadow: 0 0 12px rgba(16,217,126,0.4); }
.feedback.nope { color: var(--red); }
.feedback.warn { color: var(--amber); }

/* ─── Floating score popup ─── */
.score-pop {
  position: fixed;
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 28px;
  color: var(--green);
  text-shadow: var(--glow-green);
  pointer-events: none;
  animation: scorePop 0.9s ease-out forwards;
  z-index: 999;
}

@keyframes scorePop {
  0% { opacity: 1; transform: translateY(0) scale(0.8); }
  30% { opacity: 1; transform: translateY(-20px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-70px) scale(1); }
}

/* ─── Confetti / particles ─── */
.particle {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 998;
  animation: particleFly var(--dur, 0.9s) ease-out forwards;
}

@keyframes particleFly {
  0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(720deg) scale(0.3); }
}

/* ─── Split columns ─── */
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 14px;
  transition: border-color 0.3s;
}

.card:first-child { border-color: rgba(16,217,126,0.22); }

.card h2 {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.list { margin: 0; padding-left: 18px; max-height: 240px; overflow: auto; }
.list li {
  margin: 4px 0;
  color: var(--text);
  font-size: 14px;
  animation: listItemIn 0.25s ease-out;
}

@keyframes listItemIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

.muted { color: var(--muted); font-size: 13px; }
.footer { margin-top: 14px; }
code {
  background: rgba(0,0,0,0.3);
  padding: 2px 7px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 12px;
}

/* ─── Responsive ─── */
@media (max-width: 860px) {
  .header { flex-direction: column; align-items: flex-start; }
  .split { grid-template-columns: 1fr; }
}

@media (max-width: 540px) {
  h1 { font-size: 24px; }
  .stats { gap: 6px; }
  .stat { min-width: 72px; padding: 8px 10px; }
  .statValue { font-size: 20px; }
}

/* ─── Screen-flash on correct ─── */
.flash-correct {
  animation: flashGreen 0.4s ease-out;
}

@keyframes flashGreen {
  0% { box-shadow: inset 0 0 0 2px rgba(16,217,126,0); }
  30% { box-shadow: inset 0 0 0 2px rgba(16,217,126,0.8), 0 0 40px rgba(16,217,126,0.2); }
  100% { box-shadow: inset 0 0 0 2px rgba(16,217,126,0); }
}

/* ─── Game over overlay ─── */
.game-over-banner {
  text-align: center;
  padding: 10px;
  background: linear-gradient(135deg, rgba(255,176,32,0.12), rgba(168,85,247,0.12));
  border: 1px solid rgba(255,176,32,0.3);
  border-radius: 16px;
  margin-bottom: 10px;
  animation: bannerIn 0.4s ease-out;
}

@keyframes bannerIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.game-over-title {
  font-family: 'Nunito', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--amber);
}


/* ─── PWA/mobile additions ─── */
.header-actions { display:flex; gap:10px; align-items:center; }
.install-btn { white-space:nowrap; border-color:rgba(6,200,232,.45); background:rgba(6,200,232,.12); }
@media (max-width: 720px) {
  .app { margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom)); }
  .header { align-items:flex-start; flex-direction:column; }
  .header-actions { width:100%; flex-direction:column; align-items:stretch; }
  .stats { width:100%; display:grid; grid-template-columns:repeat(3,1fr); }
  .stat { min-width:0; padding:8px 6px; }
  .statValue { font-size:22px; }
  .lang-toggle { justify-self:center; align-self:center; }
  .install-btn { width:100%; }
  .answerRow { position:sticky; bottom:max(6px, env(safe-area-inset-bottom)); z-index:5; padding:8px; margin-left:-8px; margin-right:-8px; background:rgba(6,13,26,.92); backdrop-filter:blur(12px); border-radius:16px; }
  .answerInput { font-size:16px; min-width:0; }
  .split { grid-template-columns:1fr; }
}

  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1><img src="icons/icon-192.png" alt="Geography Hub globe" style="width:44px;height:44px;vertical-align:middle;margin-right:8px;border-radius:12px;"> Geography Hub</h1>
        <p class="sub">Pick a letter or continent, then type as many as you can before the timer runs out.</p>
      </div>
      <div class="header-actions">
        <button id="installBtn" class="btn install-btn" hidden>Install app</button>
      <div class="stats">
        <div class="stat" id="statTime">
          <div class="statLabel">Time</div>
          <div id="timeLeft" class="statValue">60</div>
        </div>
        <div class="stat" id="statScore">
          <div class="statLabel">Score</div>
          <div id="score" class="statValue">0</div>
        </div>
        <div class="stat" id="statFound">
          <div class="statLabel">Found</div>
          <div id="foundCount" class="statValue">0</div>
        
        </div>
        <div id="langToggle" class="lang-toggle">
        <span id="langEN" class="lang-pill active">EN</span>
        <span id="langRU" class="lang-pill">RU</span>
      </div>
      </div>
      </div>
    </header>

    <div class="timer-bar-wrap">
      <div id="timerBar" class="timer-bar-fill"></div>
    </div>

    <section class="panel" id="mainPanel">
      <div id="gameOverBanner"></div>

      <div class="row">
        <div class="tabs" role="tablist">
          <button id="tabCountries" class="tab active" role="tab">Countries</button>
          <button id="tabCapitals"  class="tab"        role="tab">Capitals</button>
          <button id="tabContinent" class="tab"        role="tab">By Continent</button>
        </div>
        <div class="controls">
          <label class="toggle">
            <input id="toggleTerritories" type="checkbox" checked />
            <span>Include territories</span>
          </label>
          <button id="startBtn" class="btn primary">&#9654; Start (60s)</button>
          <button id="resetBtn" class="btn">&#8635; Reset</button>
        </div>
      </div>

      <div id="letters"    class="letters"    aria-label="Letter picker"></div>
      <div id="continents" class="continents" aria-label="Continent picker"></div>

      <div class="prompt">
        <div id="promptText" class="promptText">Choose a letter to begin.</div>
        <div id="hintText"   class="hint"></div>
      </div>

      <div class="answerRow">
        <input id="answerInput" class="answerInput" placeholder="Type an answer and press Enter…" autocomplete="off" spellcheck="false" />
        <button id="submitBtn" class="btn accent">Submit</button>
      </div>

      <div id="feedback" class="feedback" aria-live="polite"></div>

      <div class="split">
        <section class="card">
          <h2>✅ Correct answers</h2>
          <ul id="foundList" class="list"></ul>
        </section>
        <section class="card">
          <h2>📋 Remaining</h2>
          <p class="muted">Hidden while the timer runs.</p>
          <button id="revealBtn" class="btn">Reveal missed</button>
          <ul id="missedList" class="list"></ul>
        </section>
      </div>

      <footer class="footer">
        <span class="muted">Data: <code>quiz_data.json</code></span>
      </footer>
    </section>
  </main>

<script src="script.js"></script>
</body>
</html>
